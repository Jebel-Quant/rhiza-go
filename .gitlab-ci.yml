# This file is part of the jebel-quant/rhiza-go repository
# (https://github.com/jebel-quant/rhiza-go).
#
# GitLab CI/CD Main Configuration
#
# This file defines the pipeline structure for the rhiza-go project.
# It provides Go-based CI/CD with testing, linting, and pre-commit checks.
#
# Workflows included:
#   - CI: Run tests with Go
#   - PRE-COMMIT: Run pre-commit checks

# Define pipeline stages
stages:
  - .pre          # Pre-pipeline jobs (validation)
  - build         # Build jobs
  - test          # Test jobs (CI, pre-commit)
  - deploy        # Deployment jobs
  - .post         # Post-pipeline jobs (finalization)

# Default settings for all jobs
default:
  # Retry failed jobs once
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Variables that can be overridden per project
variables:
  GO_VERSION: "1.23"

# Job templates for reusable configuration
.go_base:
  image: golang:${GO_VERSION}-bookworm
  before_script:
    - go mod download

# CI job - Run Go tests
ci:
  extends: .go_base
  stage: test
  script:
    - make test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Lint job - Run Go linters
lint:
  extends: .go_base
  stage: test
  script:
    - make lint
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Format check - Run Go formatting
fmt:
  extends: .go_base
  stage: test
  script:
    - make fmt
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
