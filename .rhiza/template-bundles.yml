# Rhiza-Go Template Bundle Definitions
#
# This file defines template bundles - pre-configured sets of files that can be
# included in downstream Go projects by selecting templates instead of listing
# individual file paths.
#
# Usage in downstream projects (.rhiza/template.yml):
#
#   templates:
#     - tests
#     - docker
#
# Instead of manually listing:
#
#   include: |
#     .rhiza/make.d/test.mk
#     docker/Dockerfile
#     ...
#
# Versioning:
#   The version field below tracks the rhiza-go template version and should
#   always match the VERSION file at the repository root. This ensures that
#   downstream projects can reference specific template bundle versions when
#   syncing from this repository.

# Template bundle version - aligned with project VERSION
version: 0.2.1

# Bundle Definitions
bundles:
  # ============================================================================
  # CORE - Required infrastructure
  # ============================================================================
  core:
    description: "Core Rhiza infrastructure for Go projects"
    required: true
    standalone: true
    files:
      # Core Rhiza files
      - .rhiza/rhiza.mk
      - .rhiza/.cfg.toml
      - .rhiza/.env
      - .rhiza/.gitignore
      - .rhiza/.rhiza-version
      - .rhiza/make.d/custom-env.mk
      - .rhiza/make.d/docs.mk
      - .rhiza/make.d/custom-task.mk
      - .rhiza/make.d/quality.mk
      - .rhiza/make.d/security.mk
      - .rhiza/make.d/bootstrap.mk
      - .rhiza/make.d/releasing.mk
      - .rhiza/make.d/README.md
      - .rhiza/docs
      - .rhiza/assets

      # Root configuration files
      - Makefile
      - .pre-commit-config.yaml
      - .editorconfig
      - .gitignore
      - .go-version
      - .golangci.yml
      - .goreleaser.yml
      - renovate.json

      # Documentation files (user-facing docs)
      - docs/API.md
      - docs/SECURITY.md
      - docs/ARCHITECTURE.md
      - docs/CUSTOMIZATION.md
      - docs/GLOSSARY.md
      - docs/QUICK_REFERENCE.md
      - docs/DEMO.md

  github:
    description: "GitHub Actions workflows for CI/CD"
    standalone: true
    requires: [core]
    files:
      - .rhiza/make.d/github.mk
      - .rhiza/make.d/agentic.mk
      # Core GitHub Actions workflows
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/rhiza_validate.yml
      - .github/workflows/rhiza_sync.yml
      - .github/workflows/rhiza_pre-commit.yml
      - .github/workflows/rhiza_release.yml
      - .github/actions/configure-git-auth
      - .github/dependabot.yml
      - .github/copilot-instructions.md
      - .github/agents
      - .github/hooks

  # ============================================================================
  # LEGAL - Legal and community files
  # ============================================================================
  legal:
    description: "Legal and community documentation files"
    standalone: true
    requires: []
    files:
      # Legal files
      - LICENSE

      # Community files
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md

  # ============================================================================
  # DEVCONTAINER - VS Code DevContainer configuration
  # ============================================================================
  devcontainer:
    description: "VS Code DevContainer configuration for consistent development environments"
    standalone: true
    requires: []
    files:
      # DevContainer configuration
      - .devcontainer/devcontainer.json
      - .devcontainer/bootstrap.sh

      # Documentation
      - docs/DEVCONTAINER.md

      # GitHub Actions workflows
      - .github/workflows/rhiza_devcontainer.yml

  # ============================================================================
  # DOCKER - Docker containerization support
  # ============================================================================
  docker:
    description: "Docker containerization support for building and running Go containers"
    standalone: true
    requires: []
    files:
      # Docker configuration and files
      - docker/Dockerfile
      - docker/Dockerfile.dockerignore

      # Make targets
      - .rhiza/make.d/docker.mk

      # Documentation
      - docs/DOCKER.md

      # GitHub Actions workflows
      - .github/workflows/rhiza_docker.yml

  # ============================================================================
  # LFS - Git Large File Storage support
  # ============================================================================
  lfs:
    description: "Git LFS (Large File Storage) installation and management"
    standalone: true
    requires: []
    files:
      # Make targets for LFS
      - .rhiza/make.d/lfs.mk

      # Documentation
      - .rhiza/docs/LFS.md

  # ============================================================================
  # PRESENTATION - Presentation building with reveal.js
  # ============================================================================
  presentation:
    description: "Presentation building using reveal.js"
    standalone: true
    requires: []
    files:
      - .rhiza/make.d/presentation.mk
      - docs/PRESENTATION.md

  # ============================================================================
  # GITLAB - GitLab CI/CD pipeline configuration
  # ============================================================================
  gitlab:
    description: "GitLab CI/CD pipeline configuration and workflows"
    standalone: true
    requires: [core]
    notes: |
      GitLab workflows provide similar functionality to GitHub Actions.
      Some workflows (like ci) may benefit from having their
      corresponding feature templates (tests) also enabled.
    files:
      # Main GitLab CI configuration
      - .gitlab-ci.yml

      # GitLab workflow files
      - .gitlab/workflows/rhiza_ci.yml
      - .gitlab/workflows/rhiza_pre-commit.yml
      - .gitlab/workflows/rhiza_release.yml
      - .gitlab/workflows/rhiza_renovate.yml
      - .gitlab/workflows/rhiza_sync.yml
      - .gitlab/workflows/rhiza_validate.yml

      # GitLab documentation
      - .gitlab/COMPARISON.md
      - .gitlab/README.md
      - .gitlab/SUMMARY.md
      - .gitlab/TESTING.md

  # ============================================================================
  # TESTS - Testing infrastructure with go test, coverage, and benchmarks
  # ============================================================================
  tests:
    description: "Testing infrastructure with go test, coverage, race detection, and benchmarks"
    standalone: true
    requires: []
    files:
      # Make targets and configuration
      - .rhiza/make.d/test.mk

      # Core/generic test files
      - .rhiza/tests

      # Benchmark and stress test infrastructure
      - tests/benchmarks
      - docs/TESTS.md

      # GitHub Actions workflows
      - .github/workflows/rhiza_ci.yml
      - .github/workflows/rhiza_security.yml
      - .github/workflows/rhiza_codeql.yml
      - .github/workflows/rhiza_benchmarks.yml

  # ============================================================================
  # BOOK - Documentation book generation
  # ============================================================================
  book:
    description: |
      Documentation book generation combining:
      - API reference link to pkg.go.dev
      - Test coverage reports
      - Test results
    standalone: false
    requires:
      - tests  # Required: book needs test coverage and reports
    files:
      # Book building configuration
      - .rhiza/make.d/book.mk

      # Documentation
      - docs/BOOK.md

      # GitHub Actions workflows
      - .github/workflows/rhiza_book.yml
