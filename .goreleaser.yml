# GoReleaser configuration for rhiza-go
# Documentation: https://goreleaser.com
#
# To validate: goreleaser check
# To test locally: goreleaser release --snapshot --clean
# To release: goreleaser release (triggered by CI on tag push)

version: 2

project_name: rhiza-go

before:
  hooks:
    - go mod tidy

builds:
  - id: rhiza-go
    main: ./cmd/rhiza-go
    binary: rhiza-go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums.txt'

sboms:
  - id: source
    artifacts: source
    documents:
      - sbom.cdx.json
    cmd: syft
    args:
      - scan
      - "."
      - -o
      - cyclonedx-json=${document}

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  draft: true
  replace_existing_draft: true

brews:
  - name: rhiza-go
    repository:
      owner: Jebel-Quant
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    directory: Formula
    homepage: "https://github.com/Jebel-Quant/rhiza-go"
    description: "Strong roots for Go projects - reusable configuration templates for modern Go development"
    license: "MIT"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
    install: |
      bin.install "rhiza-go"
    test: |
      system "#{bin}/rhiza-go", "--version"
