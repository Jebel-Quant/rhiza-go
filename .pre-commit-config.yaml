# This file is part of the jebel-quant/rhiza-go repository
# (https://github.com/jebel-quant/rhiza-go).
#
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        args: ["--unsafe"]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports
      - id: go-mod-tidy
      - id: golangci-lint

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        args: ["--disable", "MD013"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.36.1
    hooks:
      - id: check-renovate
        args: [ "--verbose" ]

      - id: check-github-workflows
        args: ["--verbose"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      # go-vet runs on packages (./...) rather than individual files
      - id: go-vet
        name: go vet
        language: system
        entry: bash -c 'go vet ./...'
        pass_filenames: false
        types: [go]

      - id: goreleaser-check
        name: goreleaser check
        language: system
        entry: goreleaser check --quiet
        files: \.goreleaser\.ya?ml$
        pass_filenames: false
        files: \.goreleaser\.ya?ml$
        pass_filenames: false
