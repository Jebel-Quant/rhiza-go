name: (RHIZA) VALIDATE

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version

      - name: Configure git auth for private packages
        uses: ./.github/actions/configure-git-auth
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Validate Rhiza config
        # don't run this in rhiza itself or rhiza-go. These are templates, not consumers.
        if: ${{ github.repository != 'jebel-quant/rhiza' && github.repository != 'jebel-quant/rhiza-go' }}
        shell: bash
        run: |
          echo "Skipping rhiza CLI validation for Go template projects"

      - name: Run Rhiza Tests
        shell: bash
        run: |
          make rhiza-test
