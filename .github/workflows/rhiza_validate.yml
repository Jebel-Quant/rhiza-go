name: (RHIZA) VALIDATE

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7.3.0
        with:
          version: "0.10.2"
          
      - name: Configure git auth for private packages
        uses: ./.github/actions/configure-git-auth
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Validate Rhiza config
        # don't run this in rhiza itself or rhiza-go. These are templates, not consumers.
        # don't run for Go projects that have no pyproject.toml
        if: ${{ github.repository != 'jebel-quant/rhiza' && github.repository != 'jebel-quant/rhiza-go' }}
        shell: bash
        run: |
          if [ -f "pyproject.toml" ]; then
            uvx "rhiza>=0.8.0" validate .
          else
            echo "Skipping Python-specific validation (no pyproject.toml found)"
          fi
        
      - name: Run Rhiza Tests
        shell: bash
        run: |
          make rhiza-test
