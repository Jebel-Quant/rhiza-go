name: "(RHIZA) CI"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  setup:
    name: Compute Go versions
    runs-on: ubuntu-latest
    outputs:
      go-versions: ${{ steps.versions.outputs.matrix }}
      go-current: ${{ steps.versions.outputs.current }}
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Derive version matrix from .go-version
      id: versions
      run: |
        current=$(cat .go-version | tr -d '[:space:]')
        major=$(echo "$current" | cut -d. -f1)
        minor=$(echo "$current" | cut -d. -f2)
        prev="${major}.$((minor - 1))"
        echo "matrix=[\"${prev}\",\"${current}\"]" >> "$GITHUB_OUTPUT"
        echo "current=${current}" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        go-version: ${{ fromJson(needs.setup.outputs.go-versions) }}
    
    steps:
    - uses: actions/checkout@v6.0.2
    
    - name: Set up Go
      uses: actions/setup-go@v6.0.0
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Install dependencies
      run: make install
    
    - name: Run tests
      run: make test
    
    - name: Run tests with race detector
      run: make test-race
    
    - name: Run govulncheck
      if: matrix.go-version == needs.setup.outputs.go-current
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
    
    - name: Upload coverage to Codecov
      if: matrix.go-version == needs.setup.outputs.go-current
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6.0.2
    
    - name: Set up Go
      uses: actions/setup-go@v6.0.0
      with:
        go-version-file: .go-version
    
    - name: Check formatting
      run: make check-fmt
    
    - name: Run go vet
      run: make vet
    
    - name: Run golangci-lint
      run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6.0.2
    
    - name: Set up Go
      uses: actions/setup-go@v6.0.0
      with:
        go-version-file: .go-version
    
    - name: Build
      run: make build
