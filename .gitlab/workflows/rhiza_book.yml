# This file is part of the jebel-quant/rhiza-go repository
# (https://github.com/jebel-quant/rhiza-go).
#
# Workflow: Book (GitLab CI)
#
# Purpose: This workflow builds and deploys Go documentation for the project.
#          It generates godoc API documentation and coverage reports,
#          then deploys them as a GitLab Pages site.
#
# Trigger: This workflow runs on every push to the main or master branch
#
# Components:
#   - 📖 Generate Go documentation with godoc
#   - 🧪 Generate coverage reports
#   - 🚀 Deploy combined documentation to GitLab Pages

variables:
  GO_VERSION: "1.23"

pages:
  stage: deploy
  needs: []
  image: golang:${GO_VERSION}-bookworm
  before_script:
    - go mod download
  script:
    - |
      # Check if PUBLISH_COMPANION_BOOK is set (defaults to allowing deployment)
      if [ "${PUBLISH_COMPANION_BOOK:-true}" = "false" ]; then
        echo "PUBLISH_COMPANION_BOOK is set to false, skipping deployment"
        exit 0
      fi

      # Build the book (godoc + coverage)
      make book

      # GitLab Pages expects artifacts in the "public" directory
      mv _book public

      touch public/.nojekyll
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
