# This file is part of the jebel-quant/rhiza-go repository
# (https://github.com/jebel-quant/rhiza-go).
#
# Workflow: Formatting & Linting (GitLab CI)
#
# Purpose: This workflow runs Go formatting and linting checks to ensure
#          code quality and consistency across the codebase.
#
# Trigger: This workflow runs on every push and on merge requests to main/master
#          branches (including from forks)
#
# Components:
#   - 🔍 Run Go formatting and linting checks

variables:
  GO_VERSION: "1.23"

fmt:check:
  stage: test
  needs: []
  image: golang:${GO_VERSION}-bookworm
  before_script:
    - go mod download
  script:
    - make fmt
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
