# This file is part of the jebel-quant/rhiza-go repository
# (https://github.com/jebel-quant/rhiza-go).
#
# Workflow: Continuous Integration (GitLab CI)
#
# Purpose: Run tests with Go to ensure correctness and compatibility.
#
# Trigger: On push and merge requests to main/master branches.

variables:
  GO_VERSION: "1.23"

ci:test:
  stage: test
  image: golang:${GO_VERSION}-bookworm
  before_script:
    - go mod download
  script:
    - make test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
