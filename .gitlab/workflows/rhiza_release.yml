# This file is part of the jebel-quant/rhiza-go repository
# (https://github.com/jebel-quant/rhiza-go).
#
# Release Workflow for Go Projects (GitLab CI)
#
# This workflow implements a secure, maintainable release pipeline with distinct phases:
#
# 📋 Pipeline Phases:
#   1. 🔍 Validate Tag - Check tag format, VERSION file match, and no existing release
#   2. 🏗️ Build - Build Go binaries using goreleaser and generate SBOM with syft
#   3. 📝 Create Release - Create GitLab release with build artifacts
#
# 📄 Requirements:
#   - VERSION file with the current version (without "v" prefix)
#   - .goreleaser.yml configuration (optional, goreleaser has sensible defaults)
#
# ✅ To Trigger:
#   Create and push a version tag:
#     git tag v1.2.3
#     git push origin v1.2.3

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/

variables:
  GO_VERSION: "1.23"
  RELEASE_TAG: $CI_COMMIT_TAG

release:validate:
  stage: .pre
  image: alpine:latest
  script:
    - apk add --no-cache git curl jq
    - |
      TAG="$CI_COMMIT_TAG"
      echo "Validating tag: $TAG"

      # Verify version matches tag
      if [ -f "VERSION" ]; then
        TAG_VERSION="${TAG#v}"
        PROJECT_VERSION=$(cat VERSION | tr -d '[:space:]')

        if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
          echo "❌ Version mismatch: VERSION file has '$PROJECT_VERSION' but tag is '$TAG_VERSION'"
          exit 1
        fi
        echo "✅ Version verified: $PROJECT_VERSION matches tag"
      fi

      # Check if release already exists (using GitLab API)
      RELEASE_EXISTS=$(curl --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${TAG}" \
        -s -o /dev/null -w "%{http_code}")

      if [ "$RELEASE_EXISTS" = "200" ]; then
        echo "❌ Release '$TAG' already exists. Please use a new tag."
        exit 1
      fi

      echo "✅ Tag validation passed"

release:build:
  stage: build
  needs:
    - job: release:validate
  image: golang:${GO_VERSION}-bookworm
  before_script:
    - go mod download
    - go install github.com/goreleaser/goreleaser/v2@latest
  script:
    - |
      echo "📦 Building Go binaries with goreleaser..."
      goreleaser release --snapshot --clean

      # Generate SBOM with syft
      if ! command -v syft >/dev/null 2>&1; then
        echo "⚠️ syft not found, installing..."
        go install github.com/anchore/syft/cmd/syft@latest
      fi
      echo "📋 Generating SBOM..."
      syft . -o spdx-json=dist/sbom.spdx.json
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

release:create:
  stage: deploy
  needs:
    - job: release:build
      artifacts: true
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      TAG="$CI_COMMIT_TAG"
      RELEASE_NOTES="Release $TAG"

      # Create release using GitLab API
      curl --request POST \
        --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
        --data "tag_name=$TAG" \
        --data "name=$TAG" \
        --data "description=$RELEASE_NOTES" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"

      echo "✅ Release created"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
      when: on_success
